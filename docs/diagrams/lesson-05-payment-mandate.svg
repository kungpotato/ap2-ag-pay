<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l05-title l05-desc">
  <title id="l05-title">Lesson 5: Payment Mandate and Stripe settlement</title>
  <desc id="l05-desc">Browser sends the full intent, cart, and approval envelopes to the payment route, which verifies the entire chain before calling Stripe to create and confirm a test-mode PaymentIntent, then signs a Payment Mandate linking all four mandates together.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 5 · PAYMENT MANDATE</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">AP2 authorizes; Stripe settles</text>

  <line x1="90" y1="100" x2="90" y2="360" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <line x1="330" y1="100" x2="330" y2="360" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <line x1="600" y1="100" x2="600" y2="360" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>

  <rect x="30" y="72" width="120" height="28" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
  <text x="90" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Browser</text>

  <rect x="250" y="72" width="160" height="28" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="330" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">/api/agent/pay</text>

  <rect x="530" y="72" width="140" height="28" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8"/>
  <text x="600" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Stripe (test mode)</text>

  <path d="M 90 128 L 330 128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="110" y="110" width="220" height="14" rx="2" fill="#f5f5f5"/>
  <text x="220" y="120" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.03em">POST intent + cart + approval</text>

  <rect x="255" y="145" width="150" height="30" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-dasharray="4,4"/>
  <text x="330" y="164" text-anchor="middle" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">verify 3 signatures</text>

  <rect x="255" y="185" width="150" height="30" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-dasharray="4,4"/>
  <text x="330" y="204" text-anchor="middle" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">check linkage + amounts</text>

  <path d="M 330 225 L 90 225" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="140" y="208" width="150" height="14" rx="2" fill="#f5f5f5"/>
  <text x="215" y="218" text-anchor="middle" fill="#c0392b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">400 on any mismatch</text>

  <path d="M 330 235 L 600 235" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="380" y="217" width="170" height="14" rx="2" fill="#f5f5f5"/>
  <text x="465" y="227" text-anchor="middle" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.03em">create + confirm PaymentIntent</text>

  <rect x="540" y="250" width="120" height="26" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8" stroke-dasharray="4,4"/>
  <text x="600" y="267" text-anchor="middle" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">status: succeeded</text>

  <path d="M 600 285 L 330 285" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="365" y="267" width="200" height="14" rx="2" fill="#f5f5f5"/>
  <text x="465" y="277" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.03em">sign(merchant key)</text>

  <path d="M 330 318 L 90 318" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="130" y="300" width="160" height="14" rx="2" fill="#f5f5f5"/>
  <text x="210" y="310" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">200 {payment mandate}</text>

  <text x="90" y="345" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">verify with merchant public key</text>

  <line x1="30" y1="366" x2="750" y2="366" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="180" y="382" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">Blue = settlement rail (Stripe); coral = the AP2 mandate that records it happened under authorization.</text>
</svg>
