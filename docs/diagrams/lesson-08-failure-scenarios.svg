<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l08-title l08-desc">
  <title id="l08-title">Lesson 8: four failure scenarios along the AP2 pipeline</title>
  <desc id="l08-desc">Each stage of the pipeline — intent, cart, payment, and post-settlement — has its own failure mode: insufficient budget and expired mandate are rejected before a cart exists, a declined card is rejected before any mandate or order is created, and a dispute arrives after settlement, resolved using the mandate chain as evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect width="820" height="420" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 8 · FAILURE &amp; DISPUTE SCENARIOS</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">The mandate chain is the point when something goes wrong</text>

  <!-- pipeline spine -->
  <line x1="80" y1="130" x2="740" y2="130" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>

  <!-- stage nodes -->
  <rect x="60" y="105" width="130" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="125" y="134" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Intent</text>

  <rect x="260" y="105" width="130" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="325" y="134" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Cart</text>

  <rect x="460" y="105" width="130" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="525" y="134" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Payment</text>

  <rect x="640" y="105" width="140" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="710" y="134" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Post-settlement</text>

  <!-- Scenario 1: budget -->
  <path d="M 325 155 L 325 200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-bad)"/>
  <rect x="215" y="210" width="220" height="60" rx="6" fill="rgba(192,57,43,0.05)" stroke="#c0392b"/>
  <text x="325" y="232" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Budget too low</text>
  <text x="325" y="248" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">no catalog item fits</text>
  <text x="325" y="261" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">no Cart Mandate ever created</text>

  <!-- Scenario 2: expired -->
  <path d="M 125 155 L 125 200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-bad)"/>
  <rect x="20" y="210" width="200" height="60" rx="6" fill="rgba(192,57,43,0.05)" stroke="#c0392b"/>
  <text x="120" y="232" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Intent expired</text>
  <text x="120" y="248" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">signature valid, TTL passed</text>
  <text x="120" y="261" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">rejected at cart route</text>

  <!-- Scenario 3: decline -->
  <path d="M 525 155 L 525 200" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-bad)"/>
  <rect x="435" y="210" width="180" height="60" rx="6" fill="rgba(192,57,43,0.05)" stroke="#c0392b"/>
  <text x="525" y="232" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Card declined</text>
  <text x="525" y="248" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Stripe rejects at network</text>
  <text x="525" y="261" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">no Payment Mandate created</text>

  <!-- Scenario 4: dispute -->
  <path d="M 710 155 L 710 200" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="620" y="210" width="180" height="80" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="710" y="232" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Dispute filed</text>
  <text x="710" y="248" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">charge.dispute.created</text>
  <text x="710" y="262" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">order already settled —</text>
  <text x="710" y="274" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">mandate chain is the evidence</text>

  <!-- evidence chain -->
  <rect x="215" y="320" width="405" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-dasharray="4,4"/>
  <text x="417" y="342" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Intent → Cart → Approval → PaymentIntent</text>
  <text x="417" y="358" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">four ids, one chain, answers the dispute</text>

  <path d="M 710 290 L 710 305 L 417 305 L 417 320" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Legend -->
  <line x1="30" y1="396" x2="790" y2="396" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="180" y="412" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">Red = rejected before money moves; coral = accountability after it already has.</text>
</svg>
