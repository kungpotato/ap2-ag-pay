<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l07-title l07-desc">
  <title id="l07-title">Lesson 7: webhook reconciliation as two independent confirmations</title>
  <desc id="l07-desc">The pay route records an order as pending confirmation from Stripe's synchronous response, and only a separately arriving webhook event advances it to confirmed, with both facts kept as distinct timestamped log entries.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="780" height="420" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 7 · WEBHOOK RECONCILIATION</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">"API call returned" is not "order confirmed"</text>

  <!-- t0: pay route -->
  <rect x="30" y="90" width="180" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="120" y="115" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">/api/agent/pay</text>
  <text x="120" y="131" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">stripe.paymentIntents.create</text>

  <!-- order record -->
  <rect x="290" y="90" width="200" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="390" y="112" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Order record</text>
  <text x="390" y="128" text-anchor="middle" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">status: pending_confirmation</text>
  <text x="390" y="142" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">event: sync-response</text>

  <path d="M 210 120 L 290 120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="215" y="103" width="70" height="14" rx="2" fill="#f5f5f5"/>
  <text x="250" y="113" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">succeeded</text>

  <!-- Stripe -->
  <rect x="560" y="90" width="160" height="60" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8"/>
  <text x="640" y="115" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Stripe</text>
  <text x="640" y="131" text-anchor="middle" fill="#2e5aa8" font-size="9" font-family="'Geist Mono', monospace">payment_intent.succeeded</text>

  <path d="M 560 120 L 490 120" stroke="none"/>

  <!-- time arrow down: async gap -->
  <line x1="640" y1="150" x2="640" y2="230" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="655" y="195" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">async, seconds later</text>

  <!-- webhook route -->
  <rect x="470" y="240" width="180" height="60" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8"/>
  <text x="560" y="262" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">/api/webhooks/stripe</text>
  <text x="560" y="278" text-anchor="middle" fill="#2e5aa8" font-size="9" font-family="'Geist Mono', monospace">verifies webhook signature</text>

  <path d="M 640 230 L 560 240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- order updated -->
  <rect x="220" y="240" width="200" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="320" y="262" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Order record</text>
  <text x="320" y="278" text-anchor="middle" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">status: succeeded</text>
  <text x="320" y="292" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">event: webhook (independent)</text>

  <path d="M 470 270 L 420 270" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Browser polling -->
  <rect x="30" y="240" width="150" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
  <text x="105" y="265" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Browser</text>
  <text x="105" y="281" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">clicks "refresh"</text>

  <path d="M 180 270 L 220 270" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="30" y1="336" x2="750" y2="336" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="180" y="352" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">Both events are kept in the log — the order only becomes final once the second, independent one arrives.</text>
</svg>
