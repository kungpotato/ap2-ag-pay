<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l02-title l02-desc">
  <title id="l02-title">Lesson 2: Intent Mandate sequence</title>
  <desc id="l02-desc">User message flows through the shopping agent UI to an API route that parses it into constraints, signs an Intent Mandate with a demo Ed25519 key, and returns it for the browser to independently verify.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 2 · INTENT MANDATE</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">User's ask becomes a signed, verifiable object</text>

  <!-- Lifelines -->
  <line x1="90" y1="100" x2="90" y2="330" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <line x1="300" y1="100" x2="300" y2="330" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <line x1="530" y1="100" x2="530" y2="330" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <line x1="690" y1="100" x2="690" y2="330" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>

  <!-- Actor headers -->
  <rect x="30" y="72" width="120" height="28" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
  <text x="90" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Browser (user)</text>

  <rect x="230" y="72" width="140" height="28" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="300" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">/api/agent/intent</text>

  <rect x="460" y="72" width="140" height="28" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="530" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Parser + demo key</text>

  <rect x="620" y="72" width="140" height="28" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
  <text x="690" y="90" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Web Crypto</text>

  <!-- 1: message -->
  <path d="M 90 130 L 300 130" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="120" y="112" width="150" height="14" rx="2" fill="#f5f5f5"/>
  <text x="195" y="122" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">POST {message}</text>

  <!-- 2: parse -->
  <path d="M 300 165 L 530 165" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="345" y="147" width="140" height="14" rx="2" fill="#f5f5f5"/>
  <text x="415" y="157" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">PARSE → CONSTRAINTS</text>

  <!-- 3: sign -->
  <path d="M 530 195 L 530 195" stroke="none"/>
  <rect x="470" y="180" width="120" height="28" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-dasharray="4,4"/>
  <text x="530" y="198" text-anchor="middle" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">sign(Ed25519)</text>

  <!-- 4: signed envelope back to route -->
  <path d="M 530 230 L 300 230" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="335" y="212" width="150" height="14" rx="2" fill="#f5f5f5"/>
  <text x="410" y="222" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">SIGNED ENVELOPE</text>

  <!-- 5: response to browser -->
  <path d="M 300 260 L 90 260" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="120" y="242" width="150" height="14" rx="2" fill="#f5f5f5"/>
  <text x="195" y="252" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">200 {envelope}</text>

  <!-- 6: browser verifies with public key (dashed, own lifeline to Web Crypto) -->
  <path d="M 90 295 L 690 295 L 690 295" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="330" y="277" width="180" height="14" rx="2" fill="#f5f5f5"/>
  <text x="420" y="287" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">VERIFY WITH PUBLIC KEY</text>

  <!-- Legend -->
  <line x1="30" y1="346" x2="730" y2="346" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="362" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="180" y="362" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">Coral = the signed mandate travelling; the browser trusts nothing it can't verify itself.</text>
</svg>
