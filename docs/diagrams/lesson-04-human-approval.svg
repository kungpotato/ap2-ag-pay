<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l04-title l04-desc">
  <title id="l04-title">Lesson 4: human-in-the-loop cart approval</title>
  <desc id="l04-desc">State machine showing a built Cart Mandate moving to either a manual human-click approval or an automatic within-budget approval, both producing the same CartApproval signed by the human approver's key, ready for payment.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 4 · HUMAN-IN-THE-LOOP</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">Two paths, one verifiable fact: who authorized paying</text>

  <!-- Cart Mandate node -->
  <rect x="30" y="150" width="160" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="110" y="176" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cart Mandate</text>
  <text x="110" y="192" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">signed by merchant</text>

  <!-- branch decision -->
  <rect x="250" y="150" width="150" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,4"/>
  <text x="325" y="176" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Auto-approve</text>
  <text x="325" y="192" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">checkbox on?</text>

  <!-- path A: manual -->
  <path d="M 190 165 L 250 165" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="470" y="80" width="180" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
  <text x="560" y="106" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Human clicks</text>
  <text x="560" y="122" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">"Approve &amp; authorize"</text>

  <path d="M 400 165 L 430 165 L 430 110 L 470 110" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="405" y="128" width="30" height="14" rx="2" fill="#f5f5f5"/>
  <text x="420" y="138" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NO</text>

  <!-- path B: auto -->
  <rect x="470" y="220" width="180" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
  <text x="560" y="246" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">System checks</text>
  <text x="560" y="262" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">total ≤ intent budget</text>

  <path d="M 400 195 L 430 195 L 430 250 L 470 250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="405" y="220" width="30" height="14" rx="2" fill="#f5f5f5"/>
  <text x="420" y="230" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">YES</text>

  <!-- both converge to POST /api/agent/approve -->
  <rect x="470" y="160" width="0" height="0"/>
  <path d="M 650 110 L 690 110 L 690 175" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
  <path d="M 650 250 L 690 250 L 690 185" fill="none" stroke="#eb6c36" stroke-width="1.2"/>

  <rect x="590" y="160" width="130" height="30" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="655" y="180" text-anchor="middle" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">POST /agent/approve</text>

  <path d="M 655 190 L 655 260 L 720 260" fill="none" stroke="none"/>

  <!-- result -->
  <rect x="290" y="300" width="220" height="50" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="400" y="320" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">CartApproval</text>
  <text x="400" y="336" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">signed by human approver key</text>

  <path d="M 655 190 L 655 293 L 400 293 L 400 300" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="470" y="286" width="180" height="14" rx="2" fill="#f5f5f5"/>
  <text x="560" y="296" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.03em">verify chain, sign approval</text>

  <!-- Legend -->
  <line x1="30" y1="360" x2="730" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="180" y="374" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">Same signed artifact either way — only approvalMethod differs, so it's always auditable which path was taken.</text>
</svg>
