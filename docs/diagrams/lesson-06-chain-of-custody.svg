<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l06-title l06-desc">
  <title id="l06-title">Lesson 6: chain-of-custody verification across a trust boundary</title>
  <desc id="l06-desc">Before calling Stripe, the Next.js payment route sends each signed mandate to a standalone Go verifier process, which independently re-derives the canonical JSON and checks the Ed25519 signature, failing the payment closed if that service is unreachable rather than trusting the app's own conclusion.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 6 · CHAIN OF CUSTODY</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">A different process, a different language, the same answer</text>

  <!-- Trust boundary -->
  <rect x="430" y="90" width="300" height="230" rx="8" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="580" y="108" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRUST BOUNDARY</text>

  <!-- Next.js app -->
  <rect x="60" y="140" width="180" height="70" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
  <text x="150" y="168" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">/api/agent/pay</text>
  <text x="150" y="184" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Next.js · TypeScript</text>
  <text x="150" y="198" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">holds 3 signed envelopes</text>

  <!-- Go verifier (inside boundary) -->
  <rect x="470" y="140" width="220" height="70" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36"/>
  <text x="580" y="168" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">verifier/main.go</text>
  <text x="580" y="184" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">separate process · Go</text>
  <text x="580" y="198" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">re-derives canonical JSON, checks Ed25519</text>

  <path d="M 240 165 L 470 165" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="290 " y="147" width="130" height="14" rx="2" fill="#f5f5f5"/>
  <text x="355" y="157" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.03em">POST /verify ×3</text>

  <path d="M 470 195 L 240 195" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="300" y="177" width="110" height="14" rx="2" fill="#f5f5f5"/>
  <text x="355" y="187" text-anchor="middle" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.03em">{"{valid: bool}"}</text>

  <!-- outcomes -->
  <rect x="60" y="245" width="180" height="55" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,4"/>
  <text x="150" y="267" text-anchor="middle" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">all 3 valid</text>
  <text x="150" y="282" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">→ call Stripe</text>

  <rect x="60" y="310" width="180" height="55" rx="6" fill="rgba(192,57,43,0.05)" stroke="#c0392b" stroke-dasharray="4,4"/>
  <text x="150" y="332" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="600" font-family="'Geist', sans-serif">any invalid / unreachable</text>
  <text x="150" y="347" text-anchor="middle" fill="#c0392b" font-size="8" font-family="'Geist Mono', monospace">→ 400/502, no Stripe call</text>

  <line x1="30" y1="378" x2="750" y2="378" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="394" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <text x="180" y="394" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">The boundary is real: the verifier is a separate binary, unreachable if it's not running — tested by killing it mid-flow.</text>
</svg>
