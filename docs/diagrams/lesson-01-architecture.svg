<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="l01-title l01-desc">
  <title id="l01-title">Lesson 1: Bookshop skeleton architecture</title>
  <desc id="l01-desc">Browser talks directly to Next.js pages, which read a static book catalog and read/write a cart in browser localStorage — no agent or mandate layer yet.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#f5f5f5"/>

  <text x="30" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LESSON 1 · BASELINE</text>
  <text x="30" y="58" fill="#2d3142" font-size="20" font-family="'Instrument Serif', serif">Bookshop skeleton — no agent yet</text>

  <!-- Connectors (drawn before boxes) -->
  <path d="M 150 150 L 150 120 L 290 120 L 290 150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="185" y="102" width="64" height="14" rx="2" fill="#f5f5f5"/>
  <text x="217" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROWSE</text>

  <path d="M 430 180 L 470 180 L 470 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 350 210 L 350 240 L 470 240 L 470 210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="378" y="222" width="72" height="14" rx="2" fill="#f5f5f5"/>
  <text x="414" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ/WRITE</text>

  <path d="M 290 210 L 290 260 L 150 260 L 150 210" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="180" y="248" width="80" height="14" rx="2" fill="#f5f5f5"/>
  <text x="220" y="258" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER CART</text>

  <!-- Browser (input) -->
  <rect x="90" y="150" width="120" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="90" y="150" width="120" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="150" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
  <text x="150" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user</text>

  <!-- Next.js App (focal) -->
  <rect x="290" y="150" width="140" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="290" y="150" width="140" height="60" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
  <text x="360" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next.js App Router</text>
  <text x="360" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">page.tsx · cart/page.tsx</text>
  <text x="360" y="201" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">manual checkout only</text>

  <!-- Catalog (store, static) -->
  <rect x="90" y="60" width="120" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="90" y="60" width="120" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="150" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Book Catalog</text>
  <text x="150" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lib/catalog.ts</text>

  <!-- localStorage (state) -->
  <rect x="470" y="150" width="140" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="470" y="150" width="140" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="540" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cart State</text>
  <text x="540" y="189" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser localStorage</text>

  <path d="M 210 80 L 290 80 L 290 150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="240" y="64" width="42" height="14" rx="2" fill="#f5f5f5"/>
  <text x="261" y="74" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIST</text>

  <!-- Legend -->
  <line x1="30" y1="286" x2="690" y2="286" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="180" cy="298" r="4" fill="none" stroke="#eb6c36"/>
  <text x="190" y="302" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal (app logic)</text>
  <circle cx="340" cy="298" r="4" fill="none" stroke="#4f5d75"/>
  <text x="350" y="302" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Store / state</text>
  <text x="480" y="302" fill="#7a8399" font-size="9" font-family="'Instrument Serif', serif" font-style="italic">No agent, no mandates — pre-AP2 baseline</text>
</svg>
